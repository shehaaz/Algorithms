<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sorting &middot; Algorithm Visualizer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="./index.html">
      <span class="logo" aria-hidden="true"></span>
      <span>Algorithm Visualizer</span>
    </a>
    <div class="links">
      <a class="active" href="./sorting.html">Sorting</a>
      <a href="./searching.html">Searching</a>
      <a href="./pathfinding.html">Pathfinding</a>
    </div>
  </nav>

  <main class="container">
    <h1 class="section-title">Sorting Algorithms</h1>
    <p class="section-sub">Pick an algorithm, generate an array, and press <b>Run</b>. Bars colored by their role in the current step.</p>

    <div class="controls">
      <label>
        Algorithm
        <select id="algo">
          <option value="bubble">Bubble Sort</option>
          <option value="insertion">Insertion Sort</option>
          <option value="selection">Selection Sort</option>
          <option value="merge">Merge Sort</option>
          <option value="quick">Quick Sort</option>
        </select>
      </label>

      <label>
        Size
        <input id="size" type="range" min="8" max="120" value="50">
        <span id="sizeVal">50</span>
      </label>

      <label>
        Speed
        <input id="speed" type="range" min="1" max="100" value="60">
      </label>

      <button class="btn" id="shuffle">Shuffle</button>
      <button class="btn primary" id="run">Run</button>
      <button class="btn danger" id="stop" disabled>Stop</button>
    </div>

    <section class="stage">
      <div class="canvas-wrap">
        <div class="bars" id="bars"></div>
      </div>
      <div class="legend">
        <span><span class="dot default"></span>unsorted</span>
        <span><span class="dot compare"></span>comparing</span>
        <span><span class="dot swap"></span>swapping</span>
        <span><span class="dot pivot"></span>pivot</span>
        <span><span class="dot sorted"></span>sorted</span>
      </div>
      <div class="stats">
        <span class="stat">Comparisons<b id="cmp">0</b></span>
        <span class="stat">Swaps / writes<b id="swp">0</b></span>
        <span class="stat">Status<b id="status">idle</b></span>
      </div>
    </section>

    <section class="info" id="info">
      <h3 id="info-title">Bubble Sort</h3>
      <p id="info-desc"></p>
      <div class="complexity" id="info-complexity"></div>
    </section>
  </main>

  <footer class="footer">Algorithm Visualizer &middot; sorting</footer>

  <script src="js/sorting.js"></script>
</body>
</html>
